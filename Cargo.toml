[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol",
    "crates/agent",
    "crates/edge",
    "crates/control-plane",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Async runtime. ADR-002 makes Tokio the intended runtime for all
# networking code; crate-level deps re-export these via `<name>.workspace = true`.
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
    "fs",
] }
# Structured logging per INV-003 (avoid leaking payloads; logs use spans/events only).
tracing = "0.1"

# Concrete dependency versions used by individual crates that need them.
# Listed here so every crate resolves the same version.
tokio-stream = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
# rcgen's broad time requirement otherwise resolves to releases above the
# workspace's Rust 1.75 MSRV. Keep test certificate generation MSRV-compatible.
time = "=0.3.36"
sha2 = { version = "0.10", default-features = false }
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Treat warnings as errors during the foundation phase so the workspace stays clean.
# Per-crate opt-outs should be removed as code matures.
all = { level = "warn" }

[profile.release]
lto = "thin"
codegen-units = 1
